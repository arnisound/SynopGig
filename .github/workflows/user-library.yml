name: Bibliothèque USER

# A user shares equipment from the app: it opens an issue titled
# "[Matériel USER] …" whose JSON block is added to public/user-library.json.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: user-library
  cancel-in-progress: false

jobs:
  add:
    if: startsWith(github.event.issue.title, '[Matériel USER]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: add
        continue-on-error: true
        run: node scripts/add-user-material.ts
      - name: Commit
        if: steps.add.outcome == 'success' && steps.add.outputs.name != ''
        env:
          NAME: ${{ steps.add.outputs.name }}
          AUTHOR: ${{ github.event.issue.user.login }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "synopgig-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/user-library.json
          git commit -m "Bibliothèque USER : $NAME (#$NUMBER, $AUTHOR)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.add.outputs.message }}
          NUMBER: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.add.outcome }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "${MESSAGE:-Erreur inattendue pendant l’ajout.}"
          if [ "$OUTCOME" = "success" ]; then
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          fi
